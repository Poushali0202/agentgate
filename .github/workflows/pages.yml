# Publishes trap-page/ to GitHub Pages so Apify and the shopper agent can fetch it over the public web.
# One-time setup by a repo admin: Settings -> Pages -> Source: "GitHub Actions".
name: Trap pages

on:
  push:
    branches: [main]
    paths: ["trap-page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trap-page
      - id: deploy
        uses: actions/deploy-pages@v4
